<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesso ao Projeto Santos - plataforma de estudos de Lei Seca">
  <title>Entrar | Projeto Santos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --orange: #f97316;
      --orange-dark: #ea580c;
      --orange-soft: #fff7ed;
      --gray-950: #111827;
      --gray-700: #374151;
      --gray-500: #6b7280;
      --gray-300: #d1d5db;
      --gray-100: #f3f4f6;
      --white: #ffffff;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--gray-950);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(249, 115, 22, .15), transparent 28%),
        linear-gradient(135deg, #fff 0%, #f7f8fa 55%, #fff7ed 100%);
    }

    .login-shell {
      width: min(100%, 960px);
      min-height: 580px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      background: var(--white);
      border: 1px solid #eceff3;
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(17, 24, 39, .12);
    }

    .brand-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px;
      overflow: hidden;
      color: var(--white);
      background: linear-gradient(145deg, #fb923c 0%, #f97316 52%, #ea580c 100%);
    }

    .brand-panel::after {
      content: "";
      position: absolute;
      right: -85px;
      bottom: -100px;
      width: 300px;
      height: 300px;
      border: 48px solid rgba(255, 255, 255, .12);
      border-radius: 50%;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 800;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--orange);
      background: var(--white);
      border-radius: 13px;
      font-size: 1.25rem;
    }

    .brand-copy { position: relative; z-index: 1; }
    .brand-copy h1 { margin: 0 0 16px; max-width: 390px; font-size: clamp(2rem, 4vw, 3.25rem); line-height: 1.05; }
    .brand-copy p { margin: 0; max-width: 380px; color: rgba(255, 255, 255, .84); font-size: 1rem; line-height: 1.65; }

    .login-panel {
      display: flex;
      align-items: center;
      padding: 56px;
    }

    .login-content { width: 100%; }
    .eyebrow { margin: 0 0 8px; color: var(--orange); font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h2 { margin: 0 0 10px; font-size: 2rem; }
    .subtitle { margin: 0 0 32px; color: var(--gray-500); line-height: 1.55; }

    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; color: var(--gray-700); font-size: .88rem; font-weight: 700; }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      min-height: 50px;
      padding: 0 46px 0 15px;
      color: var(--gray-950);
      background: var(--white);
      border: 1px solid var(--gray-300);
      border-radius: 12px;
      outline: none;
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(249, 115, 22, .12); }
    .input-icon, .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-500);
    }
    .password-toggle { padding: 5px; background: none; border: 0; cursor: pointer; font-size: 1rem; }

    .submit-button {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      color: var(--white);
      background: var(--orange);
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }
    .submit-button:hover { background: var(--orange-dark); transform: translateY(-1px); }
    .submit-button:disabled { opacity: .65; cursor: wait; transform: none; }

    .message { display: none; margin: 16px 0 0; padding: 12px 14px; border-radius: 10px; font-size: .88rem; line-height: 1.45; }
    .message.error { display: block; color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; }
    .message.info { display: block; color: #9a3412; background: var(--orange-soft); border: 1px solid #fed7aa; }
    .configuration-note { margin: 22px 0 0; color: var(--gray-500); font-size: .78rem; text-align: center; }

    @media (max-width: 780px) {
      .login-shell { grid-template-columns: 1fr; min-height: 0; }
      .brand-panel { min-height: 230px; padding: 34px; }
      .brand-copy h1 { margin-top: 36px; font-size: 2.15rem; }
      .brand-copy p { display: none; }
      .login-panel { padding: 38px 30px 42px; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel" aria-label="Apresentação do Projeto Santos">
      <div class="brand"><span class="brand-mark">⚡</span> Projeto Santos</div>
      <div class="brand-copy">
        <h1>Estude a lei de forma simples.</h1>
        <p>Organize seus artigos, prazos, penas e observações em um ambiente limpo e feito para revisão.</p>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-content">
        <p class="eyebrow">Bem-vindo</p>
        <h2>Entre na sua conta</h2>
        <p class="subtitle">Use o e-mail e a senha cadastrados no Supabase.</p>

        <form id="loginForm">
          <div class="field">
            <label for="email">E-mail</label>
            <div class="input-wrap">
              <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>
              <span class="input-icon" aria-hidden="true">✉</span>
            </div>
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <div class="input-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" minlength="6" required>
              <button class="password-toggle" id="togglePassword" type="button" aria-label="Mostrar senha">◉</button>
            </div>
          </div>

          <button class="submit-button" id="submitButton" type="submit">
            <span>Entrar</span><span aria-hidden="true">→</span>
          </button>
          <p class="message" id="message" role="alert"></p>
        </form>

        <p class="configuration-note">Acesso protegido pelo Supabase Authentication</p>
      </div>
    </section>
  </main>

  <script>
    // Cole abaixo a URL e a chave ANON/PUBLISHABLE do seu projeto Supabase.
    // Nunca coloque a chave service_role em arquivos públicos.
    const SUPABASE_URL = "https://gmhkrdtbsxniazoiqczx.supabase.co";
    const SUPABASE_ANON_KEY = "COLE_SUA_CHAVE_ANON_AQUI";

    const loginForm = document.getElementById("loginForm");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const isConfigured = !SUPABASE_ANON_KEY.includes("COLE_");
    const supabaseClient = isConfigured
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.setAttribute("aria-label", isPassword ? "Ocultar senha" : "Mostrar senha");
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!isConfigured) {
        showMessage("Antes de entrar, cole sua chave pública do Supabase no final do arquivo Login.html.", "info");
        return;
      }

      submitButton.disabled = true;
      submitButton.firstElementChild.textContent = "Entrando...";
      message.className = "message";

      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        showMessage(error.message === "Invalid login credentials"
          ? "E-mail ou senha incorretos."
          : `Não foi possível entrar: ${error.message}`);
        submitButton.disabled = false;
        submitButton.firstElementChild.textContent = "Entrar";
        return;
      }

      window.location.replace("Leiseca.html");
    });

    (async function redirectAuthenticatedUser() {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) window.location.replace("Leiseca.html");
    })();
  </script>
</body>
</html>
