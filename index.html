<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- Faz a tela funcionar corretamente no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Projeto Santos</title>

  <!-- Biblioteca que conecta o site ao Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --laranja: #f97316;
      --laranja-escuro: #ea580c;
      --laranja-claro: #fff7ed;
      --cinza-escuro: #1f2937;
      --cinza: #6b7280;
      --cinza-claro: #f3f4f6;
      --branco: #ffffff;
      --vermelho: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--cinza-escuro);
      background:
        radial-gradient(
          circle at top left,
          rgba(249, 115, 22, 0.16),
          transparent 35%
        ),
        var(--cinza-claro);
    }

    .container-login {
      width: 100%;
      max-width: 950px;
      min-height: 560px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      background: var(--branco);
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(31, 41, 55, 0.15);
    }

    .apresentacao {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px;
      color: var(--branco);
      background: linear-gradient(
        145deg,
        #fb923c,
        var(--laranja),
        var(--laranja-escuro)
      );
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .simbolo-logo {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--laranja);
      background: var(--branco);
      border-radius: 12px;
      font-size: 22px;
    }

    .texto-apresentacao h1 {
      margin: 0 0 15px;
      font-size: 48px;
      line-height: 1.1;
    }

    .texto-apresentacao p {
      margin: 0;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
    }

    .area-formulario {
      display: flex;
      align-items: center;
      padding: 50px;
    }

    .conteudo-formulario {
      width: 100%;
    }

    .titulo-pequeno {
      margin: 0 0 8px;
      color: var(--laranja);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .subtitulo {
      margin: 0 0 30px;
      color: var(--cinza);
      line-height: 1.5;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: var(--laranja);
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.12);
    }

    .botao-entrar {
      width: 100%;
      height: 52px;
      margin-top: 5px;
      color: var(--branco);
      background: var(--laranja);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-entrar:hover {
      background: var(--laranja-escuro);
    }

    .botao-entrar:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .mensagem {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .mensagem.erro {
      display: block;
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .mensagem.aviso {
      display: block;
      color: #9a3412;
      background: var(--laranja-claro);
      border: 1px solid #fed7aa;
    }

    .rodape-login {
      margin-top: 22px;
      color: var(--cinza);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 750px) {
      .container-login {
        grid-template-columns: 1fr;
      }

      .apresentacao {
        min-height: 230px;
        padding: 30px;
      }

      .texto-apresentacao h1 {
        margin-top: 35px;
        font-size: 34px;
      }

      .texto-apresentacao p {
        display: none;
      }

      .area-formulario {
        padding: 35px 30px;
      }
    }
  </style>
</head>

<body>
  <main class="container-login">

    <section class="apresentacao">
      <div class="logo">
        <span class="simbolo-logo">⚡</span>
        <span>Projeto Santos</span>
      </div>

      <div class="texto-apresentacao">
        <h1>Estude a lei de forma simples.</h1>

        <p>
          Organize artigos, prazos, penas e observações
          em um ambiente preparado para seus estudos.
        </p>
      </div>
    </section>

    <section class="area-formulario">
      <div class="conteudo-formulario">

        <p class="titulo-pequeno">Bem-vindo</p>

        <h2>Entre na sua conta</h2>

        <p class="subtitulo">
          Digite o e-mail e a senha cadastrados no Supabase.
        </p>

        <form id="formularioLogin">

          <div class="campo">
            <label for="email">E-mail</label>

            <input
              id="email"
              type="email"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="campo">
            <label for="senha">Senha</label>

            <input
              id="senha"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >
          </div>

          <button
            id="botaoEntrar"
            class="botao-entrar"
            type="submit"
          >
            Entrar →
          </button>

          <p id="mensagem" class="mensagem"></p>
        </form>

        <p class="rodape-login">
          Acesso protegido pelo Supabase
        </p>
      </div>
    </section>

  </main>

  <script>
    /*
      CONFIGURAÇÃO DO SUPABASE

      A URL já está preenchida.

      Você precisa trocar:
      COLE_SUA_CHAVE_ANON_AQUI

      pela sua chave pública do Supabase.

      Não use a chave chamada service_role.
    */

    const SUPABASE_URL =
      "https://gmhkrdtbsxniazoiqczx.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_bOgU7q2HkDFXxX6230cUEg_RNrkhBn0";

    const formularioLogin =
      document.getElementById("formularioLogin");

    const botaoEntrar =
      document.getElementById("botaoEntrar");

    const mensagem =
      document.getElementById("mensagem");

    const estaConfigurado =
      !SUPABASE_ANON_KEY.includes("COLE_");

    const supabaseCliente = estaConfigurado
      ? window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        )
      : null;

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = "mensagem " + tipo;
    }

    formularioLogin.addEventListener(
      "submit",
      async function (evento) {
        evento.preventDefault();

        if (!estaConfigurado) {
          mostrarMensagem(
            "Primeiro você precisa colocar sua chave pública do Supabase neste arquivo.",
            "aviso"
          );

          return;
        }

        const email =
          document.getElementById("email").value.trim();

        const senha =
          document.getElementById("senha").value;

        botaoEntrar.disabled = true;
        botaoEntrar.textContent = "Entrando...";

        const resultado =
          await supabaseCliente.auth.signInWithPassword({
            email: email,
            password: senha
          });

        if (resultado.error) {
          mostrarMensagem(
  "Erro do Supabase: " + resultado.error.message,
  "erro"
);

          botaoEntrar.disabled = false;
          botaoEntrar.textContent = "Entrar →";

          return;
        }

        window.location.href = "Leiseca.html";
      }
    );

    /*
      Se o usuário já estiver conectado,
      ele vai direto para a página Lei Seca.
    */

    async function verificarUsuarioConectado() {
      if (!supabaseCliente) {
        return;
      }

      const resultado =
        await supabaseCliente.auth.getSession();

      if (resultado.data.session) {
        window.location.href = "Leiseca.html";
      }
    }

    verificarUsuarioConectado();
  </script>
</body>
</html>
