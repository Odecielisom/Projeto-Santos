<script>
  /*
    CONFIGURAÇÃO DO SUPABASE

    A chave abaixo é do tipo publishable.
    Nunca coloque uma chave secret ou service_role aqui.
  */

  const SUPABASE_URL =
    "https://gmhkrdtbsxniazoiqczx.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_PPzbVeZRWekWKpmoth7tGw_ZC_w99F1";

  /*
    Pegamos os elementos da tela.
  */

  const formularioLogin =
    document.getElementById("formularioLogin");

  const botaoEntrar =
    document.getElementById("botaoEntrar");

  const mensagem =
    document.getElementById("mensagem");

  /*
    Verifica se a chave foi colocada.
  */

  const estaConfigurado =
    SUPABASE_URL.includes("supabase.co") &&
    !SUPABASE_ANON_KEY.includes("COLE_");

  /*
    Cria a conexão com o Supabase.
  */

  const supabaseCliente = estaConfigurado
    ? window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      )
    : null;

  /*
    Mostra uma mensagem na tela.
  */

  function mostrarMensagem(texto, tipo) {
    mensagem.textContent = texto;
    mensagem.className = "mensagem " + tipo;
  }

  /*
    Limpa a mensagem anterior.
  */

  function limparMensagem() {
    mensagem.textContent = "";
    mensagem.className = "mensagem";
  }

  /*
    Traduz os erros do Supabase para português.
  */

  function traduzirErroSupabase(erro) {
    const codigo = erro?.code || "";
    const texto = erro?.message || "";

    if (
      codigo === "invalid_credentials" ||
      texto.includes("Invalid login credentials")
    ) {
      return (
        "O Supabase não reconheceu esse e-mail e essa senha. " +
        "Confira se o usuário foi criado neste mesmo projeto."
      );
    }

    if (
      codigo === "email_not_confirmed" ||
      texto.includes("Email not confirmed")
    ) {
      return (
        "O e-mail ainda não foi confirmado no Supabase."
      );
    }

    if (
      texto.includes("Invalid API key") ||
      texto.includes("No API key")
    ) {
      return (
        "A chave pública do Supabase está incorreta."
      );
    }

    if (
      texto.includes("Failed to fetch") ||
      texto.includes("Network")
    ) {
      return (
        "Não foi possível conversar com o Supabase. " +
        "Verifique sua conexão com a internet."
      );
    }

    return "Erro do Supabase: " + texto;
  }

  /*
    Quando o usuário apertar o botão Entrar.
  */

  formularioLogin.addEventListener(
    "submit",
    async function (evento) {
      evento.preventDefault();

      limparMensagem();

      if (!estaConfigurado || !supabaseCliente) {
        mostrarMensagem(
          "A conexão com o Supabase ainda não foi configurada.",
          "aviso"
        );

        return;
      }

      const campoEmail =
        document.getElementById("email");

      const campoSenha =
        document.getElementById("senha");

      const email =
        campoEmail.value.trim().toLowerCase();

      const senha =
        campoSenha.value;

      if (!email || !senha) {
        mostrarMensagem(
          "Preencha o e-mail e a senha.",
          "aviso"
        );

        return;
      }

      botaoEntrar.disabled = true;
      botaoEntrar.textContent = "Entrando...";

      try {
        const { data, error } =
          await supabaseCliente.auth.signInWithPassword({
            email: email,
            password: senha
          });

        if (error) {
          console.error(
            "Erro enviado pelo Supabase:",
            error
          );

          mostrarMensagem(
            traduzirErroSupabase(error),
            "erro"
          );

          campoSenha.focus();

          return;
        }

        if (!data.session) {
          mostrarMensagem(
            "O Supabase aceitou os dados, mas não criou uma sessão.",
            "erro"
          );

          return;
        }

        /*
          Login realizado com sucesso.
        */

        window.location.replace("Leiseca.html");
      } catch (erro) {
        console.error(
          "Erro inesperado durante o login:",
          erro
        );

        mostrarMensagem(
          "Erro inesperado: " + erro.message,
          "erro"
        );
      } finally {
        botaoEntrar.disabled = false;
        botaoEntrar.textContent = "Entrar →";
      }
    }
  );

  /*
    Se o usuário já estiver conectado,
    vai diretamente para a página Lei Seca.
  */

  async function verificarUsuarioConectado() {
    if (!supabaseCliente) {
      return;
    }

    try {
      const { data, error } =
        await supabaseCliente.auth.getSession();

      if (error) {
        console.error(
          "Erro ao verificar a sessão:",
          error
        );

        return;
      }

      if (data.session) {
        window.location.replace("Leiseca.html");
      }
    } catch (erro) {
      console.error(
        "Não foi possível verificar a sessão:",
        erro
      );
    }
  }

  verificarUsuarioConectado();
</script>
